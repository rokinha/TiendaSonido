<body>

            <!-- Botón menú móvil -->

                class="navbar-toggler"

                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Menú -->
            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blog.html">
                            Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">

                        <a class="nav-link" href="carrito.html">
                            🛒 Carrito
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ACCESO DE USUARIOS -->
    <section class="acceso-usuario">
        <div class="container">
            <div class="botones-acceso">
                <a href="login.html" class="boton-login">
                    Iniciar sesión
                </a>

                <a href="registro.html" class="boton-registro">
                    Registrarse
                </a>
            </div>
        </div>
    </section>

    <main>
        <section id="formulario-registro" class="container formulario-registro">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <h2 class="mt-5">Registrarse: </h2>
                        <form class="mt-3">
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombres: </label>
                                <input class="form-control" type="text" id="nombre" name="nombre" placeholder="Nombres">
                            </div>

                            <div class="mb-3">
                                <label for="apellidos" class="form-label">Apellidos: </label>
                                <input class="form-control" type="text" id="apellidos" name="apellidos" placeholder="Apellidos">
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label">Correo: </label>
                                <input class="form-control" type="email" id="correo" name="correo" placeholder="Correo">
                            </div>

                            <div class="mb-3">
                                <label for="contrasena" class="form-label">Contraseña: </label>
                                <input class="form-control" type="password" id="contrasena" name="contrasena" placeholder="Contraseña">
                            </div>

                            <div class="mb-3">
                                <label for="confirmar-contrasena" class="form-label">Confirmar contraseña</label>
                                <input class="form-control" type="password" id="confirmar-contrasena" name="confirmar-contrasena" placeholder="Confirmar contraseña">
                            </div>

                            <div class="mb-3">
                                <label for="fecha-nacimiento" class="form-label">Fecha de nacimiento: </label>
                                <input class="form-control" type="date" id="fecha-nacimiento" name="fecha-nacimiento">
                            </div>

                            <div class="text-start my-5">
                                <button type="submit" class="btn btn-primary">
                                    Registrarse
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>

    <footer>
        <div class="container">
            <p>
                &copy; 2026 Sonido Vivo - Todos los derechos reservados.

                Viña del Mar, Región de Valparaíso

    </body>
