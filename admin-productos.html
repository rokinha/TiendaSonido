<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Administración de Productos - Sonido Vivo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <!-- Encabezado -->
    <header>
        <a href="index.html">
            <img src="img/logo_sonido_vivo_recortado.png"
                 alt="Logo Sonido Vivo"
                 class="logo-header">
        </a>
    </header>

    <!-- Navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <img src="img/ondaSonido.png"
                     alt="Logo onda de sonido"
                     class="logo-nav">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="blog.html">
                            Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">
                            Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            🛒 Carrito
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="admin-productos.html">
                            Administración
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main>

        <section class="container py-5">

            <!-- Título -->
            <div class="text-center mb-5">

                <p class="subtitulo-seccion">
                    ADMINISTRACIÓN
                </p>

                <h1>
                    Administración de productos
                </h1>

                <p class="descripcion-seccion">
                    Agrega nuevos productos a Sonido Vivo.
                </p>

                <div class="linea-decorativa"></div>

                <!-- Menú de administración -->
                <div class="d-flex justify-content-center gap-2 mt-4 flex-wrap">

                    <a href="admin-productos.html"
                       class="btn btn-primary">
                        Productos
                    </a>

                    <a href="admin-usuarios.html"
                       class="btn btn-outline-primary">
                        Usuarios
                    </a>

                </div>

            </div>

            <!-- Formulario de productos -->
            <section class="card producto-card">

                <div class="card-body p-4">

                    <h2 class="h3 mb-4">
                        Nuevo producto
                    </h2>

                    <form id="formProducto" novalidate>

                        <div class="row g-3">

                            <!-- Código -->
                            <div class="col-12 col-md-6">

                                <label for="codigoProducto"
                                       class="form-label">
                                    Código del producto
                                </label>

                                <input type="text"
                                       id="codigoProducto"
                                       name="codigoProducto"
                                       class="form-control">
                                       <p id="error-codigo" class="text-danger"></p>

                            </div>

                            <!-- Nombre -->
                            <div class="col-12 col-md-6">

                                <label for="nombreProducto"
                                       class="form-label">
                                    Nombre
                                </label>

                                <input type="text"
                                       id="nombreProducto"
                                       name="nombreProducto"
                                       class="form-control">
                                       <p id="error-nombre-producto" class="text-danger"></p>

                            </div>

                            <!-- Descripción -->
                            <div class="col-12">

                                <label for="descripcionProducto"
                                       class="form-label">
                                    Descripción
                                </label>

                                <textarea id="descripcionProducto"
                                          name="descripcionProducto"
                                          class="form-control"
                                          rows="4"></textarea>
                                          <p id="error-descripcion" class="text-danger"></p>

                            </div>

                            <!-- Precio -->
                            <div class="col-12 col-md-4">

                                <label for="precioProducto"
                                       class="form-label">
                                    Precio
                                </label>

                                <input type="number"
                                       id="precioProducto"
                                       name="precioProducto"
                                       class="form-control">
                                       <p id="error-precio" class="text-danger"></p>

                            </div>

                            <!-- Stock -->
                            <div class="col-12 col-md-4">

                                <label for="stockProducto"
                                       class="form-label">
                                    Stock
                                </label>

                                <input type="number"
                                       id="stockProducto"
                                       name="stockProducto"
                                       class="form-control">
                                       <p id="error-stock" class="text-danger"></p>

                            </div>

                            <!-- Stock crítico -->
                            <div class="col-12 col-md-4">

                                <label for="stockCritico"
                                       class="form-label">
                                    Stock crítico
                                </label>

                                <input type="number"
                                       id="stockCritico"
                                       name="stockCritico"
                                       class="form-control">
                                       <p id="error-stock-critico" class="text-danger"></p>

                            </div>

                            <!-- Categoría -->
                            <div class="col-12 col-md-6">

                                <label for="categoriaProducto"
                                       class="form-label">
                                    Categoría
                                </label>

                                <select id="categoriaProducto"
                                        name="categoriaProducto"
                                        class="form-select">

                                    <option value="">
                                        Seleccionar categoría
                                    </option>

                                    <option value="Guitarras">
                                        Guitarras
                                    </option>

                                    <option value="Bajos">
                                        Bajos
                                    </option>

                                    <option value="Baterías">
                                        Baterías
                                    </option>

                                    <option value="Micrófonos">
                                        Micrófonos
                                    </option>

                                    <option value="Teclados">
                                        Teclados
                                    </option>

                                    <option value="Amplificadores">
                                        Amplificadores
                                    </option>

                                    <option value="Accesorios">
                                        Accesorios
                                    </option>

                                    <option value="Audio">
                                        Audio
                                    </option>

                                    <option value="Percusión">
                                        Percusión
                                    </option>

                                </select>
                                <p id="error-categoria" class="text-danger"></p>

                            </div>

                            <!-- Imagen -->
                            <div class="col-12 col-md-6">

                                <label for="imagenProducto"
                                       class="form-label">
                                    Imagen
                                </label>

                                <input type="file"
                                       id="imagenProducto"
                                       name="imagenProducto"
                                       class="form-control"
                                       accept="image/*">
                                       <p id="error-imagen" class="text-danger"></p>

                            </div>

                            <!-- Botones -->
                            <div class="col-12">

                                <button type="submit"
                                        class="btn btn-primary">
                                    Guardar producto
                                </button>

                                <button type="reset"
                                        class="btn btn-outline-secondary">
                                    Limpiar
                                </button>

                                <p id="producto-guardado" class="text-success"></p>

                            </div>

                        </div>

                    </form>

                </div>

            </section>

        </section>

    </main>

    <!-- Pie de página -->
    <footer>

        <p>© 2026 Sonido Vivo</p>

        <p>
            Tienda de instrumentos y equipos musicales
        </p>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="js/productos.js"></script>
    <script src="js/app.js"></script>
    <script src="js/validacion-admin-productos.js"></script>

</body>

</html>
