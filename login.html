<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/estilos.css">
    <title>Iniciar Sesión - Sonido Vivo</title>
</head>

<body>
    <header>
        <img src="img/logo_sonido_vivo_recortado.png" alt="logo sonido vivo" class="logo-header">
    </header>

        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

            <div class="container">

                <a class="navbar-brand fw-bold" href="index.html">
                    <img src="img/ondaSonido.png" alt="Logo onda de sonido" class="logo-nav">
                </a>

                <!-- Botón menú móvil -->
                <button
                    class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú -->
                <div class="collapse navbar-collapse" id="menuPrincipal">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">
                                Inicio
                            </a>
                        </li>
                        
                        <li class="nav-item">
                            <a class="nav-link" href="productos.html">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="blog.html">
                                Blog
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">
                                Nosotros
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">
                                Contacto
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="carrito.html">
                                🛒 Carrito
                            </a>
                        </li>

                        <li class="nav-item">
                        <a class="nav-link" href="admin-productos.html">
                            Administración
                        </a>
                    </li>

                    </ul>

                </div>

            </div>

        </nav>

    <!-- ACCESO DE USUARIOS -->
    <section class="acceso-usuario">
        <div class="container">
            <div class="botones-acceso">
                <a href="registro.html" class="boton-registro">
                    Registrarse
                </a>
            </div>
        </div>
    </section>

    <main class="container">
       <section id="inicio-sesion" class="inicio-sesion">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">

                    <h2 class="mt-5">Iniciar sesión</h2>

                    <form id="formulario-login" novalidate>
                        <div class="my-3">
                            <label for="correo" class="form-label">Correo: </label>
                            <input class="form-control"
                                type="email"
                                id="correo"
                                name="correo"
                                placeholder="Correo">
                                <p id="error-correo" class="text-danger"></p>
                        </div>

                        <div class="my-3">
                            <label for="contrasena" class="form-label">Contraseña: </label>
                            <input class="form-control"
                                type="password"
                                id="contrasena"
                                name="contrasena"
                                placeholder="Contraseña">
                                <p id="error-contrasena" class="text-danger"></p>
                        </div>

                        <div class="text-start my-5">
                            <button type="submit" class="btn btn-primary">
                                Ingresar
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>
                &copy; 2026 Sonido Vivo - Todos los derechos reservados.
            </p>
            <p>
                Viña del Mar, Región de Valparaíso
            </p>
        </div>
    </footer>

     <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript propio -->
    <script src="js/productos.js"></script>
    <script src="js/app.js"></script>
    <script src="js/validacion-login.js"></script>
    
    
</body>
</html>
