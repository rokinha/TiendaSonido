    <meta charset="UTF-8">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

    <!-- Encabezado -->
    <header>
        <a href="index.html">
            <img src="img/logo_sonido_vivo_recortado.png"
                 alt="Logo Sonido Vivo"
                 class="logo-header">
        </a>
    </header>

    <!-- Navegación principal -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                <img src="img/ondaSonido.png"
                     alt="Logo onda de sonido"
                     class="logo-nav">
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal"
                    aria-expanded="false"
                    aria-label="Abrir menú">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="blog.html">
                            Blog
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">
                            Nosotros
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">
                            Contacto
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="carrito.html">
                            🛒 Carrito
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="admin-productos.html">
                            Administración
                        </a>
                    </li>

                </ul>

            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main>

        <section class="container py-5">

            <!-- Título -->
            <div class="text-center mb-5">

                <p class="subtitulo-seccion">
                    ADMINISTRACIÓN
                </p>

                <h1>
                    Administración de usuarios
                </h1>

                <p class="descripcion-seccion">
                    Registro y gestión de usuarios de Sonido Vivo.
                </p>

                <div class="linea-decorativa"></div>

                <!-- Menú de administración -->
                <div class="d-flex justify-content-center gap-2 mt-4 flex-wrap">

                    <a href="admin-productos.html"
                       class="btn btn-outline-primary">
                        Productos
                    </a>

                    <a href="admin-usuarios.html"
                       class="btn btn-primary">
                        Usuarios
                    </a>

                </div>

            </div>

            <!-- Formulario de usuarios -->
            <section class="card producto-card">

                <div class="card-body p-4">

                    <h2 class="h3 mb-4">
                        Nuevo usuario
                    </h2>

                    <form id="formUsuario" novalidate>

                        <div class="row g-3">

                            <!-- RUN -->
                            <div class="col-12 col-md-6">

                                <label for="runUsuario"
                                       class="form-label">
                                    RUN
                                </label>

                                <input type="text"
                                       id="runUsuario"
                                       name="runUsuario"
                                       class="form-control"
                                       placeholder="Ej: 19011022K">

                            </div>

                            <!-- Nombre -->
                            <div class="col-12 col-md-6">

                                <label for="nombreUsuario"
                                       class="form-label">
                                    Nombre
                                </label>

                                <input type="text"
                                       id="nombreUsuario"
                                       name="nombreUsuario"
                                       class="form-control">

                            </div>

                            <!-- Apellidos -->
                            <div class="col-12">

                                <label for="apellidosUsuario"
                                       class="form-label">
                                    Apellidos
                                </label>

                                <input type="text"
                                       id="apellidosUsuario"
                                       name="apellidosUsuario"
                                       class="form-control">

                            </div>

                            <!-- Correo -->
                            <div class="col-12">

                                <label for="correoUsuario"
                                       class="form-label">
                                    Correo
                                </label>

                                <input type="email"
                                       id="correoUsuario"
                                       name="correoUsuario"
                                       class="form-control"
                                       placeholder="correo@gmail.com">

                            </div>

                            <!-- Fecha de nacimiento -->
                            <div class="col-12 col-md-6">

                                <label for="fechaNacimiento"
                                       class="form-label">
                                    Fecha de nacimiento
                                </label>

                                <input type="date"
                                       id="fechaNacimiento"
                                       name="fechaNacimiento"
                                       class="form-control">

                            </div>

                            <!-- Tipo de usuario -->
                            <div class="col-12 col-md-6">

                                <label for="tipoUsuario"
                                       class="form-label">
                                    Tipo de usuario
                                </label>

                                <select id="tipoUsuario"
                                        name="tipoUsuario"
                                        class="form-select">

                                    <option value="">
                                        Seleccionar tipo de usuario
                                    </option>

                                    <option value="Administrador">
                                        Administrador
                                    </option>

                                    <option value="Cliente">
                                        Cliente
                                    </option>

                                    <option value="Vendedor">
                                        Vendedor
                                    </option>

                                </select>

                            </div>

                            <!-- Dirección -->
                            <div class="col-12">

                                <label for="direccionUsuario"
                                       class="form-label">
                                    Dirección
                                </label>

                                <textarea id="direccionUsuario"
                                          name="direccionUsuario"
                                          class="form-control"
                                          rows="3"
                                          placeholder="Ingresa la dirección"></textarea>

                            </div>

                            <!-- Botones -->
                            <div class="col-12">

                                <button type="submit"
                                        class="btn btn-primary">
                                    Guardar usuario
                                </button>

                                <button type="reset"
                                        class="btn btn-outline-secondary">
                                    Limpiar
                                </button>

                            </div>

                        </div>

                    </form>

                </div>

            </section>

        </section>

    </main>

    <!-- Pie de página -->
    <footer>

        <p>© 2026 Sonido Vivo</p>

        <p>
            Tienda de instrumentos y equipos musicales
        </p>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="js/app.js"></script>

</body>

</html>
